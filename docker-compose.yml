services:

  # INFRAESTRUTURA

  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - ecommerce-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Kafka

  kafka:
    image: apache/kafka:3.8.1
    restart: unless-stopped
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:29092,CONTROLLER://:29093,EXTERNAL://:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,EXTERNAL://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:29093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    ports:
      - "9092:9092"
    volumes:
      - kafka_data:/var/lib/kafka/data
    networks:
      - ecommerce-net
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:29092"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 20s

  # Eureka

  eureka:
    build:
      context: ./Eureka
    restart: unless-stopped
    env_file:
      - .env
    environment:
      SPRING_PROFILES_ACTIVE: prod
    ports:
      - "8761:8761"
    networks:
      - ecommerce-net

  
  # CONFIG SERVER

  config-server:
    build:
      context: ./Config_Server
    restart: unless-stopped
    env_file:
      - .env
    environment:
      SPRING_PROFILES_ACTIVE: prod
    ports:
      - "8888:8888"
    depends_on:
      eureka:
        condition: service_started
    networks:
      - ecommerce-net

  # Auth

  auth:
    build:
      context: ./Auth
    restart: unless-stopped
    env_file:
      - .env
    environment:
      SPRING_PROFILES_ACTIVE: prod
    depends_on:
      postgres:
        condition: service_healthy
      config-server:
        condition: service_started
      eureka:
        condition: service_started
    networks:
      - ecommerce-net

  #Categoria

  categoria:
    build:
      context: ./Categoria
    restart: unless-stopped
    env_file:
      - .env
    environment:
      SPRING_PROFILES_ACTIVE: prod
    depends_on:
      postgres:
        condition: service_healthy
      config-server:
        condition: service_started
      eureka:
        condition: service_started
    networks:
      - ecommerce-net

#Cliente

  cliente:
    build:
      context: ./Cliente
    restart: unless-stopped
    env_file:
      - .env
    environment:
      SPRING_PROFILES_ACTIVE: prod
    depends_on:
      postgres:
        condition: service_healthy
      config-server:
        condition: service_started
      eureka:
        condition: service_started
    networks:
      - ecommerce-net
  
  # Produto

  produto:
    build:
      context: ./Produto
    restart: unless-stopped
    env_file:
      - .env
    environment:
      SPRING_PROFILES_ACTIVE: prod
      KAFKA_PORT: 29092   # sobrescreve o 9092 do .env
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
      config-server:
        condition: service_started
      eureka:
        condition: service_started
    networks:
      - ecommerce-net
  
  # Pedido

  pedido:
    build:
      context: ./Pedido
    restart: unless-stopped
    env_file:
      - .env
    environment:
      SPRING_PROFILES_ACTIVE: prod
      KAFKA_PORT: 29092
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
      config-server:
        condition: service_started
      eureka:
        condition: service_started
    networks:
      - ecommerce-net
  
  # Notificação

  notificacao:
    build:
      context: ./Notificacao
    restart: unless-stopped
    env_file:
      - .env
    environment:
      SPRING_PROFILES_ACTIVE: prod
      KAFKA_PORT: 29092
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
      config-server:
        condition: service_started
      eureka:
        condition: service_started
    networks:
      - ecommerce-net

  # GATEWAY

  gateway:
    build:
      context: ./Gateway
    restart: unless-stopped
    env_file:
      - .env
    environment:
      SPRING_PROFILES_ACTIVE: prod
    depends_on:
      config-server:
        condition: service_started
      eureka:
        condition: service_started
      auth:
        condition: service_started
      categoria:
        condition: service_started
      cliente:
        condition: service_started
      produto:
        condition: service_started
      pedido:
        condition: service_started
      notificacao:
        condition: service_started
    ports:
      - "8765:8765"
    networks:
      - ecommerce-net

volumes:
  postgres_data:
  kafka_data:

networks:
  ecommerce-net:
    driver: bridge